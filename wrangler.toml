name = "site-layer"
main = "src/index.js"
compatibility_date = "2024-09-01"

[assets]
directory = "public"
binding = "ASSETS"
# Without this, requests matching a static file (e.g. /admin.html) are served
# directly from the assets layer and never reach the Worker's fetch handler,
# so the ADMIN_TOKEN injection and OGP rewriting below would never run.
run_worker_first = ["/", "/index.html", "/admin.html"]

# KV namespace used to store the overlay configuration (site1Url, site2Url, overlay rect).
# Create it in the Cloudflare dashboard (Workers & Pages > KV > Create a namespace)
# or with: wrangler kv namespace create CONFIG_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "52ca20bdc2b04f9c82597fac0e35927a"
preview_id = "52ca20bdc2b04f9c82597fac0e35927a"
