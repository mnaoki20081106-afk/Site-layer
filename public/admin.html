<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site Overlay - 管理画面</title>
<style>
  body { font: 14px/1.6 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input[type="text"], input[type="password"], input[type="url"], input[type="number"] {
    width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px;
    border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  select { width: 100%; padding: 8px; margin-top: 4px; }
  button { margin-top: 24px; padding: 10px 20px; font-size: 14px; cursor: pointer;
    background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
  button:hover { background: #1558b0; }
  #msg { margin-top: 16px; font-weight: 600; }
  #msg.ok { color: #188038; }
  #msg.err { color: #d93025; }
  a { color: #1a73e8; }
</style>
</head>
<body>
  <h1>Site Overlay 管理画面</h1>
  <p>サイト①・サイト②のURLと重ね方を設定します。設定は即座に <a href="/index.html">オーバーレイページ</a> に反映されます。</p>

  <label for="token">管理者トークン</label>
  <input type="password" id="token" placeholder="ADMIN_TOKEN" autocomplete="off" />

  <label for="site1Url">サイト① URL（背面）</label>
  <input type="url" id="site1Url" placeholder="https://example.com/site1" />

  <label for="site2Url">サイト② URL（前面・重ねる側）</label>
  <input type="url" id="site2Url" placeholder="https://example.com/site2" />

  <label>サイト②の表示位置・サイズ（%）</label>
  <div class="row">
    <div>top<input type="number" id="ovTop" value="0" min="0" max="100" /></div>
    <div>left<input type="number" id="ovLeft" value="0" min="0" max="100" /></div>
  </div>
  <div class="row">
    <div>width<input type="number" id="ovWidth" value="100" min="1" max="100" /></div>
    <div>height<input type="number" id="ovHeight" value="100" min="1" max="100" /></div>
  </div>

  <label for="ovOpacity">サイト②の不透明度（0〜1）</label>
  <input type="number" id="ovOpacity" value="1" min="0" max="1" step="0.05" />

  <label for="ovPointer">クリック操作の対象</label>
  <select id="ovPointer">
    <option value="auto">サイト②を操作対象にする（前面が反応）</option>
    <option value="none">サイト①を操作対象にする（クリックが背面に透過）</option>
  </select>

  <button id="save">保存</button>
  <div id="msg"></div>

<script>
(function () {
  const el = (id) => document.getElementById(id);
  const msg = el("msg");

  function setMsg(text, ok) {
    msg.textContent = text;
    msg.className = ok ? "ok" : "err";
  }

  function fillForm(config) {
    el("site1Url").value = config.site1Url || "";
    el("site2Url").value = config.site2Url || "";
    const o = Object.assign({ top: 0, left: 0, width: 100, height: 100, opacity: 1, pointerEvents: "auto" }, config.overlay || {});
    el("ovTop").value = o.top;
    el("ovLeft").value = o.left;
    el("ovWidth").value = o.width;
    el("ovHeight").value = o.height;
    el("ovOpacity").value = o.opacity;
    el("ovPointer").value = o.pointerEvents;
  }

  fetch("/api/config").then((r) => r.json()).then(fillForm).catch(() => {});

  el("save").addEventListener("click", async () => {
    const body = {
      site1Url: el("site1Url").value.trim(),
      site2Url: el("site2Url").value.trim(),
      overlay: {
        top: Number(el("ovTop").value),
        left: Number(el("ovLeft").value),
        width: Number(el("ovWidth").value),
        height: Number(el("ovHeight").value),
        opacity: Number(el("ovOpacity").value),
        pointerEvents: el("ovPointer").value,
      },
    };

    try {
      const res = await fetch("/api/config", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          authorization: "Bearer " + el("token").value.trim(),
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        setMsg("保存に失敗しました: " + (data.error || res.status), false);
        return;
      }
      setMsg("保存しました。", true);
    } catch (e) {
      setMsg("保存に失敗しました: " + e.message, false);
    }
  });
})();
</script>
</body>
</html>
